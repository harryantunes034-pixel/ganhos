<script>

// Carrega dados salvos
window.onload = function() {
  document.getElementById('inicio').value =
    localStorage.getItem('inicio') || '';

  document.getElementById('agora').value =
    localStorage.getItem('agora') || '';

  document.getElementById('valor').value =
    localStorage.getItem('valor') || '';

  document.getElementById('km').value =
    localStorage.getItem('km') || '';
};

// Salva automaticamente
function salvarDados() {
  localStorage.setItem(
    'inicio',
    document.getElementById('inicio').value
  );

  localStorage.setItem(
    'agora',
    document.getElementById('agora').value
  );

  localStorage.setItem(
    'valor',
    document.getElementById('valor').value
  );

  localStorage.setItem(
    'km',
    document.getElementById('km').value
  );
}

document.addEventListener('input', salvarDados);

function calcular() {

  const inicio =
    document.getElementById('inicio').value;

  const agora =
    document.getElementById('agora').value;

  const valor =
    parseFloat(document.getElementById('valor').value);

  const km =
    parseFloat(document.getElementById('km').value);

  if(!inicio || !agora || !valor || !km){
    alert('Preencha todos os campos.');
    return;
  }

  const [h1,m1] = inicio.split(':').map(Number);
  const [h2,m2] = agora.split(':').map(Number);

  const inicioMin = h1 * 60 + m1;
  const agoraMin = h2 * 60 + m2;

  let diferenca = agoraMin - inicioMin;

  if(diferenca <= 0){
    alert('O horário atual precisa ser maior.');
    return;
  }

  const horas = diferenca / 60;

  const ganhoHora = valor / horas;

  const ganhoKm = valor / km;

  const horasInteiras =
    Math.floor(diferenca / 60);

  const minutos =
    diferenca % 60;

  document.getElementById('resultado').style.display =
    'block';

  document.getElementById('ganhoHora').innerHTML =
    `R$ ${ganhoHora.toFixed(2)}/h`;

  document.getElementById('ganhoKm').innerHTML =
    `R$ ${ganhoKm.toFixed(2)}/km`;

  document.getElementById('tempoTrabalhado').innerHTML =
    `Tempo trabalhado: ${horasInteiras}h ${minutos}min`;
}

</script>
